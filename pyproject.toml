[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spinefm"
version = "0.1.0"
description = "Anatomy-guided CT + MRI framework on frozen foundation models for tuberculous vs pyogenic spinal infection"
readme = "README_en.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "nibabel>=5.0"]
license = { text = "MIT" }

[project.optional-dependencies]
extract = ["torch>=2.1", "monai>=1.3", "safetensors>=0.4", "pydicom>=2.4", "lighter-zoo", "TotalSegmentator>=2.0"]
baselines = ["pyradiomics", "torchvision", "SimpleITK"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
